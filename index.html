<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Market OS</title>
    <style>
      body { margin: 0; background-color: #030712; font-family: ui-sans-serif, system-ui, sans-serif; }
      #splash-root {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background-color: #030712; color: #fff;
      }
      .splash-glow {
        width: 6rem; height: 6rem; border-radius: 9999px; background-color: rgba(70, 95, 255, 0.25);
        filter: blur(24px); position: absolute;
      }
      .splash-icon {
        position: relative; width: 4rem; height: 4rem; border-radius: 1rem;
        background: linear-gradient(135deg, #465fff, #3b82f6); display: flex;
        align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold;
        box-shadow: 0 10px 25px -5px rgba(70, 95, 255, 0.4);
      }
      .splash-bar {
        width: 12rem; height: 4px; border-radius: 9999px; background-color: #1f2937;
        margin-top: 1.5rem; overflow: hidden; position: relative;
      }
      .splash-bar-inner {
        width: 40%; height: 100%; border-radius: 9999px; background-color: #465fff;
        animation: splash-anim 1.2s infinite ease-in-out;
      }
      @keyframes splash-anim {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="splash-root">
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
          <div class="splash-glow"></div>
          <div class="splash-icon">⚡</div>
        </div>
        <div style="margin-top: 1rem; text-align: center;">
          <div style="font-size: 1.125rem; font-weight: 800; letter-spacing: -0.025em; color: #f9fafb;">
            Smart Market <span style="color: #60a5fa;">OS</span>
          </div>
          <div style="font-size: 0.75rem; color: #9ca3af; margin-top: 0.25rem;">Starting wholesale engine...</div>
        </div>
        <div class="splash-bar">
          <div class="splash-bar-inner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
